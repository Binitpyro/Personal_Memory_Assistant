[package]
name = "rust_core"
version = "0.0.70"
edition = "2021"

[lib]
name = "rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
jwalk = "0.8"
rayon = "1.8"
ring = "0.17.8"
hex = "0.4"
byteorder = "1.5"
regex = "1.12.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
