[package]
name = "pma-desktop"
version = "0.0.71"
description = "Personal Memory Assistant Tauri desktop shell"
authors = ["PMA contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["test"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
portpicker = "0.1"
uuid = { version = "1.8", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["jobapi2", "processthreadsapi", "minwindef", "handleapi", "winbase", "winnt", "ioapiset"] }
