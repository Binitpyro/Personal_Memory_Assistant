name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install uv (Python toolchain)
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Build Rust Core Extension
        working-directory: app/scanner/rust_core
        run: uv run maturin develop --release

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build React Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build PyInstaller Sidecar
        run: scripts\Build-Exe.bat

      - name: Verify PyInstaller Sidecar Package
        shell: pwsh
        run: |
          if (!(Test-Path "dist\PMA-sidecar.zip")) {
            echo "::error::dist\PMA-sidecar.zip was not created."
            exit 1
          }
          Get-Item "dist\PMA-sidecar.zip" | Format-List FullName,Length,LastWriteTime

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Build Tauri MSI
        working-directory: ./frontend
        shell: pwsh
        run: |
          npx tauri build --bundles msi --verbose 2>&1 | Tee-Object -FilePath ..\tauri-msi-build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-diagnostics
          if-no-files-found: ignore
          path: |
            tauri-msi-build.log
            build\PMA\warn-PMA.txt
            build\PMA\xref-PMA.html
            frontend\src-tauri\target\release\wix\**
            frontend\src-tauri\target\release\bundle\**

      - name: Verify Build Artifacts
        shell: pwsh
        run: |
          echo "Checking sidecar output..."
          dir dist
          echo "Checking Tauri output..."
          dir frontend\src-tauri\target\release\bundle\msi

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Ensure destination files are unique
          if (Test-Path "dist\PMA-sidecar.zip") {
            Copy-Item "dist\PMA-sidecar.zip" -Destination "PMA-$tag-sidecar.zip"
          }
          $msi = Get-ChildItem "frontend\src-tauri\target\release\bundle\msi\*.msi" | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName -Destination "PMA-$tag-windows-x64.msi"
          } else {
            echo "::error::MSI artifact not found!"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PMA-*-sidecar.zip
            PMA-*-windows-x64.msi
          generate_release_notes: true
