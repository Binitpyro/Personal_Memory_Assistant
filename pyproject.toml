[project]
name = "personal-memory-assistant"
version = "0.0.70"
description = "A local-first Personal Memory Assistant with hybrid RAG search"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "lancedb>=0.10.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    # Desktop app: Tauri v2 native shell (see frontend/src-tauri)
    # pdfplumber removed: pypdf (BSD-3) covers all PDF extraction needs
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.0",
    "tenacity>=8.2.0",
    "sse-starlette>=1.6.0",
    "slowapi>=0.1.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "keyring>=24.0.0",
]

[project.scripts]
pma = "__main__:main"
pma-reindex = "scripts.reindex_embeddings:cli_main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx",
    "ruff>=0.15.8",
    "mypy>=1.20.0",
    "maturin>=1.12.6",
    "pyinstaller>=6.5.0",
    "types-PyYAML",
    "types-openpyxl",
    "types-requests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".pytest_temp"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # allow assert in tests
    "S603",  # subprocess calls are fine here
    "T201",  # allow print in CLI scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "Depends",
    "Query",
    "Path",
    "BackgroundTasks",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.BackgroundTasks",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--basetemp=.pytest_temp"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/__pycache__/*"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ['^\.pytest_temp/', '^tests/']

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "scripts"]
