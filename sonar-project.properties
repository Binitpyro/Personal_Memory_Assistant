sonar.projectKey=pma_sandisk
sonar.projectName=Personal Memory Assistant
sonar.projectVersion=0.0.69
sonar.sourceEncoding=UTF-8

# ── Source roots ──────────────────────────────────────────────────────────────
# Python backend, TypeScript frontend, helper scripts
sonar.sources=app,frontend/src,__main__.py,scripts

# Test directories (Python pytest, TypeScript vitest)
sonar.tests=tests,frontend/src/__tests__
sonar.test.inclusions=tests/**/*.py,frontend/src/__tests__/**/*.ts,frontend/src/__tests__/**/*.tsx

# ── Language settings ─────────────────────────────────────────────────────────
sonar.python.version=3.12
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.node.maxspace=4096
# NOTE: SonarQube Community Edition does not have a built-in Rust plugin.
# Rust source (app/scanner/rust_core/src) is automatically indexed via the 'app' source root.
# This is used for code duplication scanning only.
# Run `cargo test --lib` separately for Rust unit test results.

# ── Coverage ──────────────────────────────────────────────────────────────────
# Python coverage (generated by pytest-cov --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml

# TypeScript/JavaScript coverage (generated by vitest --coverage, lcov format)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Coverage exclusions ───────────────────────────────────────────────────────
sonar.coverage.exclusions=\
  frontend/src/main.tsx,\
  frontend/src/vite-env.d.ts,\
  frontend/src-tauri/**,\
  tests/**,\
  **/*.html

# ── Exclusions ────────────────────────────────────────────────────────────────
# .venv           – virtual environment
# build/, dist/   – PyInstaller output
# static/react/   – compiled frontend bundle (frontend/src is source of truth)
# node_modules    – npm packages
# __pycache__     – compiled Python bytecode
# Rust build artefacts
# SQLite database files
# SonarQube work directory
# Tests are excluded from sources to prevent double indexing (they are in sonar.tests)
sonar.exclusions=\
  .venv/**,\
  build/**,\
  dist/**,\
  static/react/**,\
  frontend/node_modules/**,\
  frontend/coverage/**,\
  frontend/src/__tests__/**,\
  **/__pycache__/**,\
  **/typeshed-fallback/**,\
  **/Python312/Lib/**,\
  app/scanner/rust_core/target/**,\
  **/*.db,\
  **/*.db-shm,\
  **/*.db-wal,\
  .scannerwork/**

# ── Server ────────────────────────────────────────────────────────────────────
sonar.host.url=http://127.0.0.1:9000
# Authentication: set SONAR_TOKEN env var or pass -Dsonar.token=<token>