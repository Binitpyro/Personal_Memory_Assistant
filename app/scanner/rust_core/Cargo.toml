[package]
name = "rust_core"
version = "0.0.72"
edition = "2021"
license = "MIT"

[lib]
name = "rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
jwalk = "0.8"
rayon = "1.8"
ring = "0.17.8"
hex = "0.4"
byteorder = "1.5"
regex = "1.12.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
