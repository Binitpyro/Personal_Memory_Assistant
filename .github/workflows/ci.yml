name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio ruff mypy

      - name: Run Ruff (Lint & Format Check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run MyPy (Type Checks)
        run: |
          mypy app/

      - name: Run Fast-Path Golden Tests
        run: |
          # Requires tests/test_fast_path.py (task 7.1)
          pytest tests/ -v
