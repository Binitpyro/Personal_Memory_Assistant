# deny.toml - Strict security and license policy

[licenses]
# List of explicitly allowed licenses. We enforce a strict NO AGPL/GPL rule.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
    "Apache-2.0 WITH LLVM-exception"
]
# Reject anything else, failing the build.
exceptions = []

[bans]
# Warn if multiple versions of the same crate are pulled in (bloat)
multiple-versions = "warn"
highlight = "all"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"

[advisories]
# Empty on purpose. RUSTSEC-2025-0020 and RUSTSEC-2026-0177 were listed here and
# in a crate-root audit.toml, but cargo-deny reported "no crate matched advisory
# criteria" for both, and `cargo audit` passes this crate with no ignores at all.
# The audit.toml was additionally at a path cargo-audit never reads, so it was
# inert regardless; it has been removed rather than relocated.
ignore = []
