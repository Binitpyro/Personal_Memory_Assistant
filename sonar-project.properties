sonar.projectKey=pma_sandisk
sonar.projectName=Personal Memory Assistant
sonar.projectVersion=0.0.55
sonar.sourceEncoding=UTF-8

# ── Source roots ──────────────────────────────────────────────────────────────
# Include all first-party Python entry points and the full frontend source tree
sonar.sources=app,frontend/src,templates,desktop.py,launcher.py,__main__.py,scripts

# Test directory
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# ── Language settings ─────────────────────────────────────────────────────────
sonar.python.version=3.12
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.node.maxspace=4096

# ── Coverage ──────────────────────────────────────────────────────────────────
# Python coverage (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclude frontend and tests from coverage calculation
sonar.coverage.exclusions=frontend/**,tests/**,**/*.html

# ── Exclusions ────────────────────────────────────────────────────────────────
# .venv           – virtual environment (thousands of library files, not our code)
# build/, dist/   – PyInstaller output
# static/react/   – compiled frontend bundle; frontend/src is the real source
# node_modules    – npm packages
# __pycache__     – compiled Python bytecode
# Rust build artefacts
# SQLite test leftovers in the project root
# Old backup / scratch files checked into root by mistake
# SonarQube own work directory
sonar.exclusions=\
  .venv/**,\
  build/**,\
  dist/**,\
  static/react/**,\
  frontend/node_modules/**,\
  **/__pycache__/**,\
  **/typeshed-fallback/**,\
  **/Python312/Lib/**,\
  app/scanner/rust_core/target/**,\
  **/*.db,\
  **/*.db-shm,\
  **/*.db-wal,\
  WebGPURenderer_old.ts,\
  bubble_mboit_old.wgsl,\
  .scannerwork/**

# ── Server ────────────────────────────────────────────────────────────────────
sonar.host.url=http://127.0.0.1:9000
# Authentication: set SONAR_TOKEN env var or pass -Dsonar.token=<token>