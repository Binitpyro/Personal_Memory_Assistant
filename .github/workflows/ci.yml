name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Run Ruff (Lint & Format Check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run MyPy (Type Checks)
        run: |
          uv run mypy app/

      - name: Run Fast-Path Golden Tests
        run: |
          # Requires tests/test_fast_path.py (task 7.1)
          uv run pytest tests/ -v --basetemp=.pytest_temp
